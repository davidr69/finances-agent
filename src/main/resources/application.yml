spring:
  # general properties
  application:
    name: finances-agent

  # datasource stuff (should really remove this and just use envars)
  datasource:
    url: jdbc:postgresql://prod-db:5432/finances

  # AI properties
  ai:
    ollama:
      base-url: http://llm:11434
      chat:
#        model: mistral
        model: qwen2.5:7b
#        model: gemma4
        num-predict: 4096
      embedding:
        model: nomic-embed-text
    #    chat:
#      memory:
#        repository:
#          jdbc:
#            initialize-schema: always
#    vectorstore:
#      pgvector:
#        initialize-schema: true
    mcp:
      server:
        protocol: streamable
        expose-mcp-client-tools: true
#      client:
#        streamable-http:
#          connections:
#            scheduler:
#              url: http://scheduler:8081

  # messaging
  kafka:
    bootstrap-servers: kafka.lavacro.net:9092
    consumer:
      group-id: 'finances-agent-CG'
      auto-offset-reset: latest
      max-poll-records: 500
      enable-auto-commit: true
      client-id: 'finances-agent-consumer'
      fetch-min-size: 4096
      fetch-max-wait: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
