server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: 'health'

spring:
  # general properties
  application:
    name: finances-agent

  # datasource stuff (should really remove this and just use envars)
  datasource:
    url: jdbc:postgresql://prod-db:5432/finances
  data:
    redis:
      repositories:
        enabled: false

  # AI properties
  ai:
    anthropic:
      chat:
        model: claude-sonnet-4-6
        max-tokens: 8192
        cache-options:
          strategy: SYSTEM_ONLY
    google:
      genai:
        chat:
          model: 'gemini-3.5-flash'
    ollama:
      base-url: http://llm:11434
      chat:
#        model: mistral
#        model: qwen2.5:7b
        model: gemma4
        num-predict: 8192
      embedding:
        model: nomic-embed-text
#    chat:
#      memory:
#        repository:
#          jdbc:
#            initialize-schema: always
#    vectorstore:
#      pgvector:
#        initialize-schema: true

  # messaging
  kafka:
    bootstrap-servers: kafka.lavacro.net:9092
    consumer:
      group-id: 'finances-agent-CG'
      auto-offset-reset: latest
      max-poll-records: 500
      enable-auto-commit: true
      client-id: 'finances-agent-consumer'
      fetch-min-size: 4096
      fetch-max-wait: 100
    listener:
      ack-mode: batch
